<script>
{
  "use strict";

  // ---------- Paleta (como no bouquet3d.py) ----------
  const C = {
    PINK:   [255, 110, 170], RED:    [255,  40,  70], ROSE:   [235,  30, 110],
    BLUSH:  [255, 185, 205], CORAL:  [255, 120, 110], WHITE:  [255, 244, 246],
    GOLD_CENTER: [255, 200, 90], DARK_CENTER: [140, 30, 50],
    LEAF: [80, 210, 120], STEM: [60, 170, 100],
    PAPER: [250, 225, 232], RIBBON: [255, 50, 95], SPARK: [255, 225, 235],
  };
  // (cor, centro, nº de pétalas)
  const DAISIES = [
    [C.WHITE,  C.GOLD_CENTER, 14], // margarida
    [C.PINK,   C.GOLD_CENTER, 8],  // cosmos rosa
    [C.RED,    C.DARK_CENTER, 7],  // vermelha
    [C.BLUSH,  C.GOLD_CENTER, 10], // rosa-claro
    [C.ROSE,   C.DARK_CENTER, 9],  // rosa forte
    [C.CORAL,  C.GOLD_CENTER, 8],  // coral
  ];
  const TULIP_COLORS = [C.RED, C.PINK, C.ROSE];

  // Rampas de caracteres por material (escuro -> claro)
  const RAMP = {
    petal:  "-=+o*%@@@",
    center: ".:o0@@",
    leaf:   ":=+*%@@@",
    paper:  " .:-=:-=",
    ribbon: ".:-=+*%@",
    stem:   ".:|||",
    spark:  "..+*",
  };

  // ---------- Vetores ----------
  const norm = v => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const add = (p, d, k) => [p[0] + d[0] * k, p[1] + d[1] * k, p[2] + d[2] * k];
  const basis = axis => {
    const helper = Math.abs(axis[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    const u = norm(cross(helper, axis));
    return [u, cross(axis, u)];
  };

  // RNG determinístico (Random(21) no original)
  let seed = 21;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  // Cada ponto: x,y,z, nx,ny,nz, r,g,b, material
  const pts = [];
  const MAT = { petal: 0, center: 1, leaf: 2, paper: 3, ribbon: 4, stem: 5, spark: 6 };
  const MAT_RAMP = [RAMP.petal, RAMP.center, RAMP.leaf, RAMP.paper, RAMP.ribbon, RAMP.stem, RAMP.spark];
  const push = (p, n, col, mat, shade = 1) => pts.push(p[0], p[1], p[2], n[0], n[1], n[2], col[0], col[1], col[2], mat, shade);

  // ---------- Geometria ----------
  function stem(from, to, step = 0.012) {
    const d = [to[0] - from[0], to[1] - from[1], to[2] - from[2]];
    const len = Math.hypot(...d), n = Math.max(2, Math.ceil(len / step));
    for (let i = 0; i <= n; i++) push(add(from, d, i / n), [0, 0, 1], C.STEM, MAT.stem);
  }

  function daisy(center, axis, size, color, centerColor, petals) {
    const [u, v] = basis(axis);
    const rc = size * 0.3, L = size - rc, W = size * Math.min(0.26, 1.35 / petals);
    const step = size / 26;
    for (let k = 0; k < petals; k++) {
      const th = (k / petals) * Math.PI * 2 + rnd() * 0.2;
      const dir = [u[0] * Math.cos(th) + v[0] * Math.sin(th), u[1] * Math.cos(th) + v[1] * Math.sin(th), u[2] * Math.cos(th) + v[2] * Math.sin(th)];
      const side = cross(axis, dir);
      for (let s = 0; s <= L; s += step) {
        const half = W * Math.sqrt(Math.max(0, 1 - ((s - L / 2) / (L / 2)) ** 2));
        for (let t = -half; t <= half; t += step) {
          const r = rc + s;
          const cup = 0.22 * (r * r) / size;       // pétalas ligeiramente em taça
          let p = add(center, dir, r); p = add(p, side, t); p = add(p, axis, cup);
          const n = norm(add(axis, dir, -0.35 * r / size));
          const edge = Math.abs(t) / (half + 1e-6);
          push(p, n, color, MAT.petal, (0.62 + 0.38 * (s / L)) * (1 - 0.25 * edge * edge));
        }
      }
    }
    // miolo em cúpula
    for (let x = -rc; x <= rc; x += step * 0.8) for (let y = -rc; y <= rc; y += step * 0.8) {
      const q = x * x + y * y; if (q > rc * rc) continue;
      const h = Math.sqrt(rc * rc - q) * 0.55;
      let p = add(center, u, x); p = add(p, v, y); p = add(p, axis, h + size * 0.02);
      push(p, norm(add(add([u[0] * x, u[1] * x, u[2] * x], v, y), axis, h + 0.001)), centerColor, MAT.center);
    }
  }

  function tulip(center, axis, size, color) {
    const [u, v] = basis(axis);
    const H = size * 1.5, R = size * 0.62, step = size / 22;
    for (let h = 0; h <= 1; h += step / H) {
      const r = R * Math.sin(Math.PI * (0.18 + 0.62 * h));
      const circ = 2 * Math.PI * r, nPhi = Math.max(8, Math.ceil(circ / step));
      for (let i = 0; i < nPhi; i++) {
        const ph = (i / nPhi) * Math.PI * 2;
        const top = 0.78 + 0.22 * Math.abs(Math.cos(1.5 * ph));   // três pontas
        if (h > top) continue;
        const rad = [u[0] * Math.cos(ph) + v[0] * Math.sin(ph), u[1] * Math.cos(ph) + v[1] * Math.sin(ph), u[2] * Math.cos(ph) + v[2] * Math.sin(ph)];
        let p = add(center, axis, h * H - H * 0.35); p = add(p, rad, r);
        push(p, norm(add(rad, axis, -0.2)), color, MAT.petal, 0.6 + 0.4 * h);
      }
    }
  }

  function leaf(base, dir, len, width, droop) {
    dir = norm(dir);
    const side = norm(cross([0, 1, 0], dir).some(Math.abs) ? cross([0, 1, 0], dir) : [1, 0, 0]);
    const nrm = norm(cross(dir, side));
    const step = 0.012;
    for (let s = 0; s <= len; s += step) {
      const f = s / len;
      const half = width * Math.sin(Math.PI * Math.min(1, f * 1.05)) * (1 - f * 0.35);
      for (let t = -half; t <= half; t += step) {
        let p = add(base, dir, s); p = add(p, side, t);
        p = add(p, [0, -1, 0], droop * f * f);           // a folha curva para baixo
        p = add(p, nrm, -Math.abs(t) * 0.5);            // nervura central
        push(p, norm(add(nrm, side, t > 0 ? 0.4 : -0.4)), C.LEAF, MAT.leaf);
      }
    }
  }

  function wrap() {
    // Cone de papel: topo largo em y=-0.02, aperta até ao laço em y=-0.62
    const yTop = -0.02, yBot = -0.6, rTop = 0.36, rBot = 0.065, step = 0.011;
    for (let y = yBot; y <= yTop; y += step) {
      const f = (y - yBot) / (yTop - yBot);
      const r = rBot + (rTop - rBot) * f;
      const n = Math.ceil((2 * Math.PI * r) / step);
      for (let i = 0; i < n; i++) {
        const ph = (i / n) * Math.PI * 2;
        const x = Math.cos(ph) * r, z = Math.sin(ph) * r;
        const slope = (rTop - rBot) / (yTop - yBot);
        push([x, y, z], norm([Math.cos(ph), -slope, Math.sin(ph)]), C.PAPER, MAT.paper);
      }
    }
  }

  function ribbon() {
    const yc = -0.6, r = 0.085, step = 0.011;
    for (let y = yc - 0.04; y <= yc + 0.04; y += step) {
      const n = Math.ceil((2 * Math.PI * r) / step);
      for (let i = 0; i < n; i++) {
        const ph = (i / n) * Math.PI * 2;
        push([Math.cos(ph) * r, y, Math.sin(ph) * r], [Math.cos(ph), 0, Math.sin(ph)], C.RIBBON, MAT.ribbon);
      }
    }
    // laço: duas voltas + pontas, à frente (z>0)
    for (const s of [-1, 1]) {
      for (let a = 0; a < Math.PI * 2; a += 0.06) {
        for (let w = -0.025; w <= 0.025; w += 0.011) {
          const x = s * (0.09 + 0.08 * Math.cos(a) * 0.9) + s * 0.0;
          const y = yc + 0.055 * Math.sin(a) + w;
          push([s * Math.abs(x), y, r + 0.02 + 0.02 * Math.cos(a)], [s * 0.4, 0, 1], C.RIBBON, MAT.ribbon);
        }
      }
      for (let t = 0; t <= 1; t += 0.04) {
        for (let w = -0.015; w <= 0.015; w += 0.011)
          push([s * (0.02 + 0.07 * t) + w, yc - 0.03 - 0.16 * t, r + 0.03], [0, 0, 1], C.RIBBON, MAT.ribbon);
      }
    }
  }

  function buildScene() {
    const D = 0.7, N = 15;
    const golden = Math.PI * (3 - Math.sqrt(5));
    const heads = [];
    for (let i = 0; i < N; i++) {
      const t = (i + 0.5) / N;
      const el = 0.25 + Math.acos(1 - t * 1.0) * 0.9;      // ~15°..~95° a partir da vertical
      const az = i * golden + rnd() * 0.3;
      const dir = norm([Math.sin(el) * Math.cos(az), Math.cos(el) * 0.9, Math.sin(el) * Math.sin(az)]);
      const pos = add([0, 0.16, 0], dir, D * (0.85 + rnd() * 0.18));
      heads.push({ pos, axis: norm([dir[0], dir[1] * 0.5 + 0.12, dir[2]]) });   // viradas para fora
    }
    // camada interior para o ramo não ficar oco
    const NI = 8;
    for (let i = 0; i < NI; i++) {
      const az = (i / NI) * Math.PI * 2 + 0.4 + rnd() * 0.3;
      const el = 0.35 + rnd() * 0.5;
      const dir = norm([Math.sin(el) * Math.cos(az), Math.cos(el), Math.sin(el) * Math.sin(az)]);
      const pos = add([0, 0.14, 0], dir, 0.42 + rnd() * 0.08);
      heads.push({ pos, axis: norm([dir[0], dir[1] * 0.6 + 0.1, dir[2]]) });
    }
    heads.forEach((h, i) => {
      const size = 0.16 + rnd() * 0.06;
      if (i % 4 === 2) tulip(h.pos, h.axis, size * 0.8, TULIP_COLORS[(i >> 2) % TULIP_COLORS.length]);
      else { const [col, cen, n] = DAISIES[i % DAISIES.length]; daisy(h.pos, h.axis, size, col, cen, n); }
      { const a0 = add(h.pos, h.axis, -size * 0.3); stem(a0, add(a0, [-a0[0], 0.02 - a0[1], -a0[2]], 0.3), 0.012); }
    });
    // folhas: uma coroa a sair do embrulho e algumas entre as flores
    const NL = 12;
    for (let i = 0; i < NL; i++) {
      const az = (i / NL) * Math.PI * 2 + 0.2;
      const out = [Math.cos(az), 0.15 + rnd() * 0.45, Math.sin(az)];
      leaf([Math.cos(az) * 0.28, 0.0 + rnd() * 0.05, Math.sin(az) * 0.28], out, 0.42 + rnd() * 0.16, 0.1, 0.14);
    }
    for (let i = 0; i < 7; i++) {
      const az = rnd() * Math.PI * 2;
      leaf([Math.cos(az) * 0.2, 0.25 + rnd() * 0.2, Math.sin(az) * 0.2], [Math.cos(az), 0.5 + rnd() * 0.4, Math.sin(az)], 0.3, 0.08, 0.06);
    }
    wrap();
    ribbon();
    // caules por baixo do laço
    for (let i = -3; i <= 3; i++) stem([i * 0.012, -0.62, 0.0], [i * 0.022, -1.02, 0.0], 0.01);

    // brilhos
    const sparks = [];
    for (let i = 0; i < 70; i++) {
      const a = rnd() * Math.PI * 2, b = Math.acos(2 * rnd() - 1) * 0.7;
      const r = 0.55 + rnd() * 0.55;
      sparks.push({ p: [Math.sin(b) * Math.cos(a) * r, 0.2 + Math.cos(b) * r * 0.8 - 0.15, Math.sin(b) * Math.sin(a) * r],
                    ph: rnd() * Math.PI * 2, sp: 1.5 + rnd() * 2.5 });
    }
    return sparks;
  }

  const sparks = buildScene();
  const P = new Float32Array(pts);
  const NP = P.length / 11;

  // ---------- Render ASCII ----------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const FONT = 'Menlo, Consolas, "SF Mono", "DejaVu Sans Mono", "Courier New", monospace';
  const L = norm([-0.45, 0.55, 0.75]);   // luz fixa em relação à câmara

  let W = 0, H = 0, dpr = 1, cols = 0, rows = 0, cw = 0, ch = 0, scale = 0, cx = 0, cy = 0;
  let zbuf, lum, colR, colG, colB, mat, reveal;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    scale = Math.min((H * 0.72) / 2.3, (W * (W < H ? 1.08 : 0.98)) / 1.95);
    cw = Math.max(3.4, (1.95 * scale) / 105);
    ch = cw / 0.56;
    cx = W / 2;
    const blockH = measureTitle();
    const total = 2.2 * scale + ch * 0.6 + blockH;
    cy = Math.max(H * 0.04, (H - total) / 2) + 1.12 * scale;
    cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);

    const n = cols * rows;
    zbuf = new Float32Array(n); lum = new Float32Array(n);
    colR = new Uint8Array(n); colG = new Uint8Array(n); colB = new Uint8Array(n);
    mat = new Int8Array(n);
    reveal = new Float32Array(n);
    for (let i = 0; i < n; i++) reveal[i] = Math.random();
    if (typeof fwResize === "function") fwResize();
    buildTitle();
    ctx.font = `700 ${ch * 0.98}px ${FONT}`;
    ctx.textBaseline = "top";
  }


  // ---------- Fogo de artifício (discreto, atrás do ramo) ----------
  const fwc = document.getElementById("fw");
  const fctx = fwc.getContext("2d");
  const FW_COLORS = ["#ff4d7d", "#ff9ec0", "#ffd27a", "#fff1f4", "#ff2e55"];
  const rockets = [], sparksFw = [];
  let nextLaunch = 0, lastFw = 0;

  function fwResize() {
    fwc.width = Math.round(W * dpr); fwc.height = Math.round(H * dpr);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.textAlign = "center"; fctx.textBaseline = "middle";
  }

  function launch() {
    const side = Math.random() < 0.5 ? -1 : 1;
    const x = W / 2 + side * Math.min(W, H) * (0.18 + Math.random() * 0.32);
    rockets.push({
      x, y: H * 0.92, tx: x + (Math.random() - 0.5) * W * 0.06,
      ty: H * (0.12 + Math.random() * 0.2), t: 0, dur: 1.1 + Math.random() * 0.4,
      color: FW_COLORS[(Math.random() * FW_COLORS.length) | 0],
    });
  }

  function burst(x, y, color) {
    const n = 46 + ((Math.random() * 18) | 0);
    const sp = Math.min(W, H) * (0.2 + Math.random() * 0.1);
    const alt = FW_COLORS[(Math.random() * FW_COLORS.length) | 0];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.15;
      const v = sp * (0.75 + Math.random() * 0.3);
      sparksFw.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 1.3 + Math.random() * 0.6,
                      color: Math.random() < 0.75 ? color : alt });
    }
  }

  function drawFireworks(now, revealed) {
    const dt = Math.min(0.05, (now - (lastFw || now)) / 1000); lastFw = now;
    fctx.clearRect(0, 0, W, H);
    if (!revealed) return;
    if (now > nextLaunch) {
      launch();
      if (Math.random() < 0.3) setTimeout(launch, 250 + Math.random() * 350);
      nextLaunch = now + 900 + Math.random() * 1100;
    }
    const fs = Math.max(9, ch * 0.95);
    fctx.font = `700 ${fs}px ${FONT}`;
    fctx.globalCompositeOperation = "lighter";

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.t += dt / r.dur;
      const e = 1 - (1 - Math.min(1, r.t)) ** 2;
      const x = r.x + (r.tx - r.x) * e, y = r.y + (r.ty - r.y) * e;
      fctx.globalAlpha = 0.85; fctx.fillStyle = r.color;
      for (let k = 0; k < 4; k++) {                 // rasto
        fctx.globalAlpha = 0.7 - k * 0.17;
        fctx.fillText(k === 0 ? "*" : ".", x, y + k * fs * 0.7);
      }
      if (r.t >= 1) { burst(x, y, r.color); rockets.splice(i, 1); }
    }

    for (let i = sparksFw.length - 1; i >= 0; i--) {
      const p = sparksFw[i];
      p.life += dt;
      const k = p.life / p.max;
      if (k >= 1) { sparksFw.splice(i, 1); continue; }
      const drag = Math.pow(0.18, dt);
      p.vx *= drag; p.vy = p.vy * drag + H * 0.06 * dt;   // abranda e cai devagar
      p.x += p.vx * dt; p.y += p.vy * dt;
      const twinkle = 0.75 + 0.25 * Math.sin(p.life * 30 + i);
      fctx.globalAlpha = (1 - k) * (1 - k) * twinkle;
      fctx.fillStyle = p.color;
      fctx.fillText(k < 0.35 ? "*" : k < 0.7 ? "+" : ".", p.x, p.y);
    }
    fctx.globalAlpha = 1;
    fctx.globalCompositeOperation = "source-over";
  }


  // ---------- "Para a Carolina" em ASCII, no estilo das flores ----------
  const TITLE = "Para a Carolina";
  const TITLE_FONT = '"Pacifico", "Brush Script MT", "Segoe Script", Georgia, serif';
  const TRAMP = " .:-=+*o%@";
  let title = [], tcw = 0, tch = 0;

  let titleLayout = null;

  // Mede o bloco de texto (1 linha em ecrãs largos, 2 em verticais)
  function measureTitle() {
    tcw = Math.max(3, cw * 0.72); tch = tcw / 0.56;
    const m = document.createElement("canvas").getContext("2d");
    m.font = `100px ${TITLE_FONT}`;
    const portrait = W < H * 0.85;
    const lines = portrait ? ["Para a", "Carolina"] : [TITLE];
    const ratio = Math.max(...lines.map(l => m.measureText(l).width)) / 100;
    const maxW = Math.min(W * 0.92, 820);
    const fontPx = Math.min(maxW / ratio, H * (portrait ? 0.105 : 0.11));
    const lineH = fontPx * 1.3;
    titleLayout = { lines, fontPx, lineH, blockH: lineH * lines.length, textW: ratio * fontPx };
    return titleLayout.blockH;
  }

  function buildTitle() {
    if (!titleLayout) measureTitle();
    const { lines, fontPx, lineH, blockH, textW } = titleLayout;
    const tcols = Math.ceil(textW / tcw) + 4, trows = Math.ceil(blockH / tch) + 2;
    const SS = 6;
    const off = document.createElement("canvas");
    off.width = tcols * SS; off.height = trows * SS;
    const o = off.getContext("2d");
    o.setTransform(SS / tcw, 0, 0, SS / tch, 0, 0);
    o.fillStyle = "#fff"; o.textAlign = "center"; o.textBaseline = "middle";
    o.font = `${fontPx}px ${TITLE_FONT}`;
    const top0 = (trows * tch - blockH) / 2;
    lines.forEach((l, i) => o.fillText(l, (tcols * tcw) / 2, top0 + lineH * (i + 0.5)));
    const data = o.getImageData(0, 0, off.width, off.height).data;

    const x0 = cx - (tcols * tcw) / 2;
    const y0 = cy + 1.08 * scale + ch * 0.6 - top0;
    const old = new Map(title.map(p => [p.key, p.at]));
    title = [];
    for (let r = 0; r < trows; r++) for (let c = 0; c < tcols; c++) {
      let sum = 0;
      for (let yy = 0; yy < SS; yy++) for (let xx = 0; xx < SS; xx++)
        sum += data[(((r * SS + yy) * off.width) + (c * SS + xx)) * 4 + 3];
      const cov = sum / (SS * SS * 255);
      if (cov < 0.12) continue;
      // ordem de escrita: linha a linha, da esquerda para a direita
      const line = Math.min(lines.length - 1, Math.max(0, Math.floor((r * tch - top0) / lineH)));
      const fx = c / tcols;
      const prog = (line + fx) / lines.length;
      const key = r * 10000 + c;
      title.push({ x: x0 + c * tcw, y: y0 + r * tch, cov, fx, key,
                   at: old.get(key) ?? (2.0 + prog * 2.4 + Math.random() * 0.3) });
    }
  }

  // rosa -> vermelho ao longo da palavra
  const lerp = (a, b, k) => a + (b - a) * k;
  function drawTitle(t) {
    if (!title.length) return;
    ctx.font = `700 ${tch * 0.98}px ${FONT}`;
    const phase = ((t - 4.5) / 4.0) % 1.6 - 0.3;             // brilho que passa a cada ~4 s
    for (const p of title) {
      if (t < p.at) continue;
      const age = t - p.at;
      const flash = Math.max(0, 1 - age / 0.5);              // acende branco e assenta na cor
      const shine = t > 4.5 ? Math.exp(-((p.fx - phase) ** 2) / 0.004) : 0;
      const wave = Math.sin(t * 2.2 - p.fx * 9) * tch * 0.12; // ondula como as flores
      const lift = (1 - Math.min(1, age / 0.6)) * tch * 0.8;  // sobe um pouco ao aparecer
      const lvl = Math.min(1, p.cov + shine * 0.4 + flash * 0.3);
      const chr = TRAMP[Math.min(TRAMP.length - 1, Math.max(1, Math.round(lvl * (TRAMP.length - 1))))];
      const w = Math.max(flash, shine * 0.75);
      const r = lerp(lerp(255, 255, p.fx), 255, w), g = lerp(lerp(140, 45, p.fx), 240, w), b = lerp(lerp(190, 85, p.fx), 245, w);
      ctx.globalAlpha = Math.min(1, age / 0.25) * (0.55 + 0.45 * p.cov);
      ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
      ctx.fillText(chr, p.x, p.y + wave + lift);
    }
    ctx.globalAlpha = 1;
    ctx.font = `700 ${ch * 0.98}px ${FONT}`;
  }


  // ---------- Interação: tocar = fogo de artifício + pétalas; arrastar = rodar ----------
  const PETAL_COLORS = ["#ff4d7d", "#ff9ec0", "#ffc2d4", "#ff2e55", "#fff1f4"];
  const tapFx = [];             // partículas desenhadas à frente do ramo
  let userAngle = 0, spin = 0, lastFxT = 0;

  function tapBurst(x, y) {
    const color = FW_COLORS[(Math.random() * FW_COLORS.length) | 0];
    const n = 40, sp = Math.min(W, H) * (W < 600 ? 0.22 : 0.16);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.2;
      const v = sp * (0.6 + Math.random() * 0.5);
      tapFx.push({ kind: 0, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 1.1 + Math.random() * 0.5,
                   color: Math.random() < 0.7 ? color : "#fff1f4" });
    }
    for (let i = 0; i < 14; i++) {                         // pétalas que caem a balançar
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
      const v = Math.min(W, H) * (0.08 + Math.random() * 0.1);
      tapFx.push({ kind: 1, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 2.6 + Math.random() * 1.2,
                   color: PETAL_COLORS[(Math.random() * PETAL_COLORS.length) | 0], ph: Math.random() * 6.28,
                   chr: "@%o*"[(Math.random() * 4) | 0] });
    }
    if (tapFx.length > 900) tapFx.splice(0, tapFx.length - 900);
  }

  function drawTapFx(now) {
    const dt = Math.min(0.05, (now - (lastFxT || now)) / 1000); lastFxT = now;
    // inércia da rotação
    if (!dragging) { userAngle += spin * dt; spin *= Math.pow(0.08, dt); }
    if (!tapFx.length) return;
    ctx.font = `700 ${Math.max(9, ch * 1.05)}px ${FONT}`;
    for (let i = tapFx.length - 1; i >= 0; i--) {
      const p = tapFx[i];
      p.life += dt;
      const k = p.life / p.max;
      if (k >= 1) { tapFx.splice(i, 1); continue; }
      if (p.kind === 0) {
        const drag = Math.pow(0.15, dt);
        p.vx *= drag; p.vy = p.vy * drag + H * 0.05 * dt;
        ctx.globalAlpha = (1 - k) * (1 - k) * (0.75 + 0.25 * Math.sin(p.life * 30 + i));
        ctx.fillStyle = p.color;
        ctx.fillText(k < 0.35 ? "*" : k < 0.7 ? "+" : ".", p.x, p.y);
      } else {
        const drag = Math.pow(0.35, dt);
        p.vx = p.vx * drag + Math.sin(p.life * 3 + p.ph) * W * 0.02 * dt;
        p.vy = p.vy * drag + H * 0.06 * dt;
        ctx.globalAlpha = Math.min(1, (1 - k) * 1.6);
        ctx.fillStyle = p.color;
        ctx.fillText(p.chr, p.x, p.y);
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    ctx.globalAlpha = 1;
    ctx.font = `700 ${ch * 0.98}px ${FONT}`;
  }

  // Ponteiro: distinguir toque de arrasto
  let dragging = false, down = null, lastX = 0, lastMoveT = 0;
  canvas.addEventListener("pointerdown", e => {
    if (!playing) return;
    down = { x: e.clientX, y: e.clientY, t: performance.now() };
    lastX = e.clientX; lastMoveT = down.t; spin = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener("pointermove", e => {
    if (!down) return;
    if (!dragging && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) {
      dragging = true; canvas.classList.add("dragging");
    }
    if (dragging) {
      const now = performance.now(), dx = e.clientX - lastX;
      const d = (dx / Math.max(240, W * 0.5)) * Math.PI;   // meio ecrã ≈ meia volta
      userAngle += d;
      spin = d / Math.max(0.008, (now - lastMoveT) / 1000);
      lastX = e.clientX; lastMoveT = now;
    }
  });
  const endPointer = e => {
    if (!down) return;
    if (!dragging) tapBurst(e.clientX, e.clientY);
    else if (performance.now() - lastMoveT > 80) spin = 0; // parou antes de largar
    spin = Math.max(-6, Math.min(6, spin));
    dragging = false; down = null; canvas.classList.remove("dragging");
    tip.classList.remove("show");
  };
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", () => { dragging = false; down = null; spin = 0; canvas.classList.remove("dragging"); });

  // dica discreta, uma vez
  const tip = document.getElementById("tip");

  let startT = 0, playing = false;
  if (document.fonts && document.fonts.load) {
    document.fonts.load('40px "Pacifico"').then(() => { if (playing) resize(); }).catch(() => {});
  }

  function frame(now) {
    const t = (now - startT) / 1000;
    const angle = t * (Math.PI * 2 / 14) + 0.35 + userAngle;   // uma volta a cada ~14 s + o que ela rodar
    const tilt = -0.22;
    const ca = Math.cos(angle), sa = Math.sin(angle), ct = Math.cos(tilt), st = Math.sin(tilt);
    const n = cols * rows;
    zbuf.fill(-1e9); mat.fill(-1);

    for (let i = 0, o = 0; i < NP; i++, o += 11) {
      // rotação em Y, depois inclinação em X
      let x = P[o] * ca + P[o + 2] * sa, z = -P[o] * sa + P[o + 2] * ca, y = P[o + 1];
      const y2 = y * ct - z * st, z2 = y * st + z * ct;
      const persp = 1 / (1 - z2 * 0.18);
      const sx = cx + x * scale * persp, sy = cy - y2 * scale * persp;
      const c = (sx / cw) | 0, r = (sy / ch) | 0;
      if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
      const k = r * cols + c;
      if (z2 <= zbuf[k]) continue;
      zbuf[k] = z2;
      let nx = P[o + 3] * ca + P[o + 5] * sa, nz = -P[o + 3] * sa + P[o + 5] * ca, ny = P[o + 4];
      const ny2 = ny * ct - nz * st, nz2 = ny * st + nz * ct;
      const d = Math.abs(nx * L[0] + ny2 * L[1] + nz2 * L[2]);
      lum[k] = (0.38 + 0.62 * d) * P[o + 10];
      colR[k] = P[o + 6]; colG[k] = P[o + 7]; colB[k] = P[o + 8];
      mat[k] = P[o + 9];
    }

    ctx.clearRect(0, 0, W, H);
    const rev = Math.min(1, t / 1.4);   // aparece ao longo de 1,4 s
    let lastStyle = "";
    for (let k = 0; k < n; k++) {
      const m = mat[k];
      if (m < 0 || reveal[k] > rev) continue;
      const ramp = MAT_RAMP[m];
      const l = lum[k];
      const ch_ = ramp[Math.min(ramp.length - 1, (l * ramp.length) | 0)];
      if (ch_ === " ") continue;
      const b = 0.62 + 0.38 * l;
      const style = `rgb(${(colR[k] * b) | 0},${(colG[k] * b) | 0},${(colB[k] * b) | 0})`;
      if (style !== lastStyle) { ctx.fillStyle = style; lastStyle = style; }
      ctx.fillText(ch_, (k % cols) * cw, ((k / cols) | 0) * ch);
    }

    // brilhos a cintilar
    ctx.fillStyle = "#ffe1ea";
    for (const s of sparks) {
      const v = Math.sin(t * s.sp + s.ph);
      if (v < 0.55 || Math.random() > rev) continue;
      const p = s.p;
      const x = p[0] * ca + p[2] * sa, z = -p[0] * sa + p[2] * ca;
      const y2 = p[1] * ct - z * st, z2 = p[1] * st + z * ct;
      const persp = 1 / (1 - z2 * 0.18);
      const c = ((cx + x * scale * persp) / cw) | 0, r = ((cy - y2 * scale * persp) / ch) | 0;
      if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
      const k = r * cols + c;
      if (mat[k] >= 0 && z2 < zbuf[k]) continue;
      ctx.fillText(v > 0.85 ? "*" : v > 0.7 ? "+" : ".", c * cw, r * ch);
    }

    drawTitle(t);
    drawTapFx(now);
    drawFireworks(now, t > 2.2);
    requestAnimationFrame(frame);
  }

  // ---------- Música ("Coming Up Roses", a partir dos 0:22, em loop) ----------
  const muteBtn = document.getElementById("mute");
  const waves = document.getElementById("waves");
  const music = document.getElementById("music");
  let muted = false;

  function startMusic() {
    // play() tem de ser chamado diretamente no toque (iPhone)
    try {
      if (navigator.audioSession) navigator.audioSession.type = "playback";
      music.currentTime = 0;
      music.volume = 0;
      const p = music.play();
      if (p && p.catch) p.catch(() => {});
      // entrada suave (no iPhone o volume é fixo; o ficheiro já tem fade-in)
      const t0 = performance.now();
      const fade = () => {
        const k = Math.min(1, (performance.now() - t0) / 800);
        try { music.volume = k; } catch (_) {}
        if (k < 1) requestAnimationFrame(fade);
      };
      requestAnimationFrame(fade);
    } catch (_) { /* sem som, a animação continua */ }
  }

  muteBtn.addEventListener("click", e => {
    e.stopPropagation();
    muted = !muted;
    music.muted = muted;
    waves.style.display = muted ? "none" : "";
    muteBtn.setAttribute("aria-label", muted ? "Ligar som" : "Desligar som");
  });

  const intro = document.getElementById("intro");
  intro.addEventListener("click", () => {
    if (playing) return;
    playing = true;
    setTimeout(() => tip.classList.add("show"), 6500);
    setTimeout(() => tip.classList.remove("show"), 12500);
    startMusic();
    intro.classList.add("hide");
    muteBtn.classList.add("show");
    resize();
    startT = performance.now() + 400;
    requestAnimationFrame(frame);
  });

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (playing) resize(); }, 150); });
}
</script>
</body>
</html>
